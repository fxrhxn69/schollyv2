<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scholarship Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="app-style">
:root{
  --paper:#F3F5F9; --surface:#FFFFFF; --ink:#16233F; --ink-2:#4A5672; --line:#D8DEE9;
  --accent:#2F54C8; --accent-ink:#FFFFFF; --soft:#E7ECF7;
  --urgent:#C2372B; --urgent-bg:#FBE6E3; --warn:#9A6A00; --warn-bg:#FFF2CF; --ok:#1E7A4C; --ok-bg:#E1F3E9;
  --muted:#8A93A8;
  --shadow:0 1px 0 rgba(22,35,63,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1626; --surface:#17213A; --ink:#E8ECF5; --ink-2:#AAB4CB; --line:#2A3654;
    --accent:#7F9CFF; --accent-ink:#0F1626; --soft:#1F2B4A;
    --urgent:#FF8A7F; --urgent-bg:#3A1D22; --warn:#F2C35B; --warn-bg:#3A3018; --ok:#6FD3A0; --ok-bg:#16352A;
    --muted:#7480A0;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1626; --surface:#17213A; --ink:#E8ECF5; --ink-2:#AAB4CB; --line:#2A3654;
  --accent:#7F9CFF; --accent-ink:#0F1626; --soft:#1F2B4A;
  --urgent:#FF8A7F; --urgent-bg:#3A1D22; --warn:#F2C35B; --warn-bg:#3A3018; --ok:#6FD3A0; --ok-bg:#16352A;
  --muted:#7480A0;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
.num{font-variant-numeric:tabular-nums}

/* Header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.top h1{margin:0;font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.top p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.save-state{font-size:13px;color:var(--muted);min-height:20px}

/* Buttons */
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--ink-2)}
.btn:focus-visible,.icon-btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible,.seg button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--urgent);border-color:var(--urgent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.icon-btn{border:0;background:transparent;border-radius:6px;padding:6px;cursor:pointer;color:var(--ink-2);display:inline-flex}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
.icon-btn svg{width:20px;height:20px}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* Next deadline board */
.board{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;margin-bottom:22px}
.next{background:var(--ink);color:var(--paper);border-radius:14px;padding:22px 24px;display:flex;gap:22px;align-items:center;min-height:150px}
:root[data-theme="dark"] .next{background:var(--soft);color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .next{background:var(--soft);color:var(--ink)}}
.flip{display:flex;gap:4px}
.flip span{display:inline-grid;place-items:center;width:52px;height:72px;border-radius:6px;background:rgba(255,255,255,.1);font-size:46px;font-weight:800;position:relative;font-variant-numeric:tabular-nums}
.flip span::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.35)}
.next .meta{min-width:0}
.next .k{font-size:13px;opacity:.75;margin:0}
.next .t{font-size:20px;font-weight:700;margin:2px 0 4px;line-height:1.25}
.next .s{font-size:14px;opacity:.8;margin:0}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{background:var(--surface);padding:14px 16px}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-2)}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;min-width:200px}
select.f{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* List */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list-head,.row{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1.2fr) minmax(0,1fr) 110px 150px 40px;gap:14px;align-items:center;padding:12px 18px}
.list-head{font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.row{border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--soft)}
.row .name{font-weight:700;line-height:1.3}
.row .uni{font-size:13px;color:var(--ink-2);margin-top:2px}
.row .cell{font-size:14px;color:var(--ink-2)}
.days{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.days small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.days.urgent{color:var(--urgent)} .days.warn{color:var(--warn)} .days.past{color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--ink-2);white-space:nowrap}
.pill.s-Accepted{background:var(--ok-bg);color:var(--ok)}
.pill.s-Rejected{background:var(--urgent-bg);color:var(--urgent)}
.pill.s-Submitted,.pill.s-Under-Review,.pill.s-Interview-Scheduled{background:var(--warn-bg);color:var(--warn)}
.status-sel{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;font-size:13px;font-weight:600;max-width:100%}
.empty{padding:48px 20px;text-align:center;color:var(--ink-2)}
.empty h3{margin:0 0 6px;color:var(--ink);font-size:18px}

/* Pipeline */
.pipeline{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.lane{background:var(--soft);border-radius:12px;padding:10px;min-height:160px}
.lane h4{margin:2px 4px 10px;font-size:13px;color:var(--ink-2);display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.card:hover{border-color:var(--ink-2)}
.card .name{font-weight:700;font-size:14px;line-height:1.3}
.card .uni{font-size:12px;color:var(--ink-2);margin:2px 0 8px}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px}
.lane-move{display:flex;gap:4px}
.lane-move button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 8px;cursor:pointer;font-weight:700}
.lane-move button:hover{border-color:var(--ink-2)}

/* Drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(15,22,38,.45);z-index:20;display:none}
.scrim.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.dr-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.dr-head h2{margin:0;font-size:20px;line-height:1.25}
.dr-head p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.dr-body{padding:6px 22px 22px;overflow:auto;flex:1}
.dr-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.sec{padding:16px 0;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 10px;font-size:14px;color:var(--accent)}
dl.kv{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:6px 14px;margin:0;font-size:14px}
dl.kv dt{color:var(--ink-2)}
dl.kv dd{margin:0;word-break:break-word}
.unv{color:var(--muted);font-style:italic}
.docs{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
.chip .box{width:14px;height:14px;border:1.5px solid currentColor;border-radius:3px;display:inline-grid;place-items:center;font-size:10px;line-height:1}
.note{background:var(--soft);border-radius:8px;padding:12px 14px;font-size:14px;white-space:pre-wrap}
a{color:var(--accent)}

.modal{position:fixed;inset:0;z-index:30;display:none;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 12px 24px;overflow:auto}
.modal.open{display:flex}
.dialog{background:var(--surface);border-radius:14px;width:min(820px,100%);border:1px solid var(--line)}
.dialog header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);border-radius:14px 14px 0 0;z-index:1}
.dialog header h2{margin:0;font-size:19px}
.dialog .body{padding:4px 22px 10px}
.dialog footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--surface);border-radius:0 0 14px 14px}
fieldset{border:0;border-bottom:1px solid var(--line);margin:0;padding:16px 0}
fieldset:last-child{border-bottom:0}
legend{font-weight:700;color:var(--accent);font-size:14px;padding:0;margin-bottom:10px;float:left;width:100%}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;clear:both}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:13px;color:var(--ink-2);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.hint{font-size:12px;color:var(--muted)}
.err{color:var(--urgent);font-size:13px;margin:8px 0 0}

.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px;display:none}
.banner.show{display:block}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* Seminars */
.sem-tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px}
.sem-tools p{margin:0;color:var(--ink-2);font-size:14px;max-width:62ch}
.sem{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.sem:last-child{border-bottom:0}
.sem.past{opacity:.55}
.cal{border:1px solid var(--line);border-radius:10px;text-align:center;overflow:hidden;background:var(--surface)}
.cal .m{background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;padding:2px 0}
.cal .d{font-size:26px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.cal .w{font-size:11px;color:var(--muted);padding-bottom:4px}
.sem h4{margin:0;font-size:15px;line-height:1.3}
.sem .o{font-size:13px;color:var(--ink-2);margin-top:2px}
.sem .n{font-size:13px;color:var(--muted);margin-top:4px}
.sem .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.sem .tag{font-size:11px;font-weight:600;background:var(--soft);color:var(--ink-2);border-radius:4px;padding:2px 6px}
.sem .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.how{background:var(--soft);border-radius:12px;padding:16px 18px;margin-top:16px;font-size:14px}
.how h3{margin:0 0 6px;font-size:15px}
.how ol{margin:6px 0 0;padding-left:20px}
.how code{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:13px}
.full{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--ok-bg);color:var(--ok);margin-left:6px;vertical-align:2px}
@media (max-width:860px){
  .sem{grid-template-columns:64px minmax(0,1fr)}
  .sem .acts{grid-column:1/-1;justify-content:flex-start}
}
@media (max-width:860px){
  .board{grid-template-columns:1fr}
  .list-head{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n d" "s s";row-gap:8px}
  .row .c-name{grid-area:n} .row .c-days{grid-area:d;text-align:right}
  .row .c-cov,.row .c-dead,.row .c-x{display:none} .row .c-status{grid-area:s}
  .grid{grid-template-columns:1fr}
  .flip span{width:42px;height:60px;font-size:36px}
}
@media (max-width:560px){
  .next{flex-direction:column;align-items:flex-start;gap:14px}
  .filters,.search,select.f{width:100%}
  .top>div:last-child{text-align:left!important}
}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}.toast{transition:none}}
</style>
</head>

/* ---------- Filtering ---------- */
function visible(){
  var q=ui.q.trim().toLowerCase();
  var arr=state.filter(function(it){var e=E(it);
    if(ui.status&&e.tracker_meta.application_status!==ui.status)return false;
    if(ui.tier==="__none"&&e.tracker_meta.priority_tier)return false;
    if(ui.tier&&ui.tier!=="__none"&&e.tracker_meta.priority_tier!==ui.tier)return false;
    if(ui.cov==="full"&&e.financial_coverage.coverage_type!=="Full Ride")return false;
    if(ui.cov==="other"&&e.financial_coverage.coverage_type==="Full Ride")return false;
    if(q){var hay=(e.scholarship_core.scholarship_name+" "+e.university_profile.university_name+" "+e.university_profile.country).toLowerCase();if(hay.indexOf(q)<0)return false}
    return true});
  var tierRank=function(t){var i=TIERS.indexOf(t);return i<0?9:i};
  arr.sort(function(a,b){var A=E(a),B=E(b);
    if(ui.sort==="name")return(A.scholarship_core.scholarship_name||"").localeCompare(B.scholarship_core.scholarship_name||"");
    if(ui.sort==="tier")return tierRank(A.tracker_meta.priority_tier)-tierRank(B.tracker_meta.priority_tier);
    if(ui.sort==="updated")return(B.tracker_meta.last_updated||"").localeCompare(A.tracker_meta.last_updated||"");
    var da=daysLeft(A.application_timeline.final_deadline),db=daysLeft(B.application_timeline.final_deadline);
    var ka=da==null?1e9:(da<0?5e8-da:da),kb=db==null?1e9:(db<0?5e8-db:db);return ka-kb});
  return arr;
}
function daysHTML(e){
  var d=daysLeft(e.application_timeline.final_deadline);
  if(d==null)return'<div class="days past">—<small>No deadline</small></div>';
  if(d<0)return'<div class="days past">Closed<small>'+esc(fmtDate(e.application_timeline.final_deadline))+'</small></div>';
  var cls=d<=30?"urgent":(d<=90?"warn":"");
  return'<div class="days '+cls+'">'+d+'<small>'+(d===1?"day left":"days left")+'</small></div>';
}

/* ---------- Render ---------- */
function render(){
  document.querySelectorAll(".seg button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.view===ui.view))});
  ["b-add","b-import"].forEach(function(id){$(id).disabled=readOnly});
  renderBoard();renderContent();
}
function renderBoard(){
  var open=state.filter(function(it){return!isClosed(E(it).tracker_meta.application_status)});
  var upcoming=[];open.forEach(function(it){var t=E(it).application_timeline;[["early",t.early_deadline],["final",t.final_deadline]].forEach(function(k){var d=daysLeft(k[1]);if(d!=null&&d>=0)upcoming.push({it:it,d:d,kind:k[0],date:k[1]})})});
  upcoming.sort(function(a,b){return a.d-b.d});
  var seenU={};upcoming=upcoming.filter(function(x){var id=E(x.it).tracker_meta.entry_id;if(seenU[id])return false;seenU[id]=1;return true});
  var nx=upcoming[0];
  var html='<div class="next">';
  if(nx){var e=E(nx.it),digits=String(nx.d).padStart(3,"0").split("");
    html+='<div class="flip num" aria-label="'+nx.d+' days">'+digits.map(function(c){return'<span>'+c+'</span>'}).join("")+'</div>'+
    '<div class="meta"><p class="k">Days until your next deadline</p><p class="t">'+esc(e.scholarship_core.scholarship_name||"Untitled scholarship")+'</p><p class="s">'+esc(e.university_profile.university_name)+'. '+(nx.kind==="early"?'Early deadline ':'Due ')+esc(fmtDate(nx.date))+'.'+'</p></div>';
  }else{
    html+='<div class="meta"><p class="k">Next deadline</p><p class="t">No upcoming deadlines</p><p class="s">Add a scholarship with a final deadline to start the countdown.</p></div>';
  }
  html+='</div>';
  var fullRides=state.filter(function(it){return E(it).financial_coverage.coverage_type==="Full Ride"}).length;
  var upSem=seminars.filter(function(x){var d=daysLeft(x.date);return d!=null&&d>=0}).length;
  var soon=upcoming.filter(function(x){return x.d<=30}).length;
  html+='<div class="stats">'+
   '<div class="stat"><b>'+state.length+'</b><span>Scholarships tracked</span></div>'+
   '<div class="stat"><b>'+fullRides+'</b><span>Full rides</span></div>'+
   '<div class="stat"><b>'+soon+'</b><span>Due within 30 days</span></div>'+
   '<div class="stat"><b>'+upSem+'</b><span>Upcoming seminars</span></div></div>';
  $("board").innerHTML=html;
}
function statusSelect(e,idx){

function renderPipeline(c,arr){
  var lanes=STATUSES;

   return'<div class="lane"><h4><span>'+esc(s)+'</span><span class="num">'+items.length+'</span></h4>'+items.map(function(it){var e=E(it),idx=state.indexOf(it),d=daysLeft(e.application_timeline.final_deadline);

function bindRows(c){
  c.querySelectorAll(".row,.card").forEach(function(r){
    r.addEventListener("click",function(ev){if(ev.target.closest("select,button"))return;openDrawer(+r.dataset.idx)});
    r.addEventListener("keydown",function(ev){if((ev.key==="Enter"||ev.key===" ")&&ev.target===r){ev.preventDefault();openDrawer(+r.dataset.idx)}});
  });
  c.querySelectorAll("[data-open]").forEach(function(b){b.addEventListener("click",function(){openDrawer(+b.dataset.open)})});
  c.querySelectorAll(".status-sel").forEach(function(s){s.addEventListener("change",function(){var e=E(state[+s.dataset.idx]);e.tracker_meta.application_status=s.value;e.tracker_meta.last_updated=todayISO();render();persist("Status changed to "+s.value)})});

/* ---------- Drawer ---------- */
function val(v,kind){
  if(v===null||v===undefined||v===""||(Array.isArray(v)&&!v.length))return'<span class="unv">Unspecified</span>';
  if(kind==="bool")return v===true?"Yes":v===false?"No":esc(v);
  if(kind==="test")return v===true?"Required":v===false?"Not required":esc(v);
  if(kind==="date")return esc(fmtDate(v));
  if(kind==="url")return'<a href="'+esc(v)+'" target="_blank" rel="noopener">'+esc(v.replace(/^https?:\/\//,"").replace(/\/$/,""))+'</a>';
  if(kind==="pct")return esc(v)+"%";
  if(Array.isArray(v))return esc(v.join(", "));
  return esc(v);
}

/* ---------- Delete confirm ---------- */
function confirmDelete(idx){
  var e=E(state[idx]);
  $("modal").innerHTML='<div class="dialog" style="width:min(440px,100%)"><header><h2 id="m-title">Delete this scholarship?</h2></header><div class="body"><p>'+esc(e.scholarship_core.scholarship_name||"This entry")+' and its document checklist will be removed from the tracker.</p></div><footer><button class="btn" type="button" id="m-cancel">Keep it</button><button class="btn primary" style="background:var(--urgent);border-color:var(--urgent)" type="button" id="m-ok">'+ICON.trash+'Delete</button></footer></div>';
  $("modal").classList.add("open");$("m-cancel").focus();
  $("m-cancel").onclick=function(){$("modal").classList.remove("open")};
  $("m-ok").onclick=function(){state.splice(idx,1);closeAll();render();persist("Deleted")};

/* ---------- Form ---------- */
function fieldHTML(f,e){
  var v=get(e,f.p),id="f_"+f.p.replace(/\./g,"_"),wide=f.w?" wide":"";
  var lab='<label for="'+id+'">'+esc(f.l)+(f.req?" *":"")+'</label>',hint=f.h?'<span class="hint">'+esc(f.h)+'</span>':"";
  if(f.t==="select")return'<div class="field'+wide+'">'+lab+'<select id="'+id+'" data-p="'+f.p+'" data-t="select"><option value="">Unspecified</option>'+f.o.map(function(o){return'<option'+(o===v?" selected":"")+'>'+esc(o)+'</option>'}).join("")+'</select>'+hint+'</div>';
  if(f.t==="bool")return'<div class="field'+wide+'">'+lab+'<select id="'+id+'" data-p="'+f.p+'" data-t="bool"><option value="">Unspecified</option><option value="true"'+(v===true?" selected":"")+'>Yes</option><option value="false"'+(v===false?" selected":"")+'>No</option></select></div>';
  if(f.t==="test")return'<div class="field'+wide+'">'+lab+'<select id="'+id+'" data-p="'+f.p+'" data-t="test"><option value="">Unspecified</option><option value="true"'+(v===true?" selected":"")+'>Required</option><option value="false"'+(v===false?" selected":"")+'>Not required</option><option value="Optional"'+(v==="Optional"?" selected":"")+'>Optional</option></select></div>';
  if(f.t==="textarea")return'<div class="field'+wide+'">'+lab+'<textarea id="'+id+'" data-p="'+f.p+'" data-t="text">'+esc(v||"")+'</textarea>'+hint+'</div>';
  if(f.t==="list")return'<div class="field'+wide+'">'+lab+'<input id="'+id+'" data-p="'+f.p+'" data-t="list" value="'+esc((v||[]).join(", "))+'">'+hint+'</div>';
  if(f.t==="multi")return'<div class="field'+wide+'"><label>'+esc(f.l)+'</label><div class="docs" data-p="'+f.p+'" data-t="multi">'+f.o.map(function(o){var on=(v||[]).indexOf(o)>=0;return'<button type="button" class="chip" data-opt="'+esc(o)+'" aria-pressed="'+on+'"><span class="box">'+(on?"✓":"")+'</span>'+esc(o)+'</button>'}).join("")+'</div></div>';
  var type=f.t==="number"?"number":f.t==="date"?"date":f.t==="url"?"url":"text";

      else if(t==="number"){v=n.value===""?null:Number(n.value);if(v!=null&&isNaN(v)){err.push(n.previousElementSibling.textContent+" must be a number");v=null}}
      else if(t==="url"){v=n.value.trim()||null;if(v&&!/^https:\/\/\S+$/.test(v))err.push(n.previousElementSibling.textContent+" must start with https://")}
      else{v=n.value.trim();if(v==="")v=(t==="text"&&/name$/.test(p))?"":null}
      set(e,p,v);
    });
    if(!e.university_profile.university_name)err.push("University is required");
    if(!e.scholarship_core.scholarship_name)err.push("Scholarship name is required");
    if(err.length){$("m-err").textContent=err.join(". ")+".";return}
    e.tracker_meta.last_updated=todayISO();
    var keep=(it._progress&&it._progress.docs_ready)||[];it._progress={docs_ready:keep.filter(function(d){return(e.eligibility_and_requirements.required_documentation||[]).indexOf(d)>=0})};
    var newIdx;
    if(isNew){state.push(it);newIdx=state.length-1}else{state[idx]=it;newIdx=idx}
    $("modal").classList.remove("open");$("modal").innerHTML="";
    render();ui.open=newIdx;persist(isNew?"Scholarship added":"Changes saved");openDrawer(newIdx);
  };
}

/* ---------- Seminars ---------- */
function normT(t){return String(t||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim()}
function mergeSeminars(list){
  var n=0;(list||[]).forEach(function(x){
    if(!x||!x.title||!x.date||!/^\d{4}-\d{2}-\d{2}$/.test(x.date))return;
    var dup=seminars.some(function(y){return y.id===x.id||(y.date===x.date&&normT(y.title)===normT(x.title))});
    if(dup)return;
    seminars.push({id:x.id||("sem-"+Date.now().toString(36)+"-"+n),title:String(x.title).slice(0,200),organizer:x.organizer||"",date:x.date,time:x.time||"",timezone:x.timezone||"",mode:x.mode||"",location:x.location||"",url:(x.url&&/^https:\/\//.test(x.url))?x.url:null,related_entry_ids:Array.isArray(x.related_entry_ids)?x.related_entry_ids:[],source:x.source||"Imported",notes:x.notes||"",registered:!!x.registered});n++});
  seminars.sort(function(a,b){return a.date.localeCompare(b.date)});return n;
}
function entryName(id){var it=state.filter(function(i){return E(i).tracker_meta.entry_id===id})[0];return it?(E(it).scholarship_core.scholarship_name||id):null}
function renderSeminars(c){
  var list=seminars.filter(function(x){var d=daysLeft(x.date);return ui.semPast?true:(d==null||d>=0)});
  var mon=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],wk=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var html='<div class="sem-tools"><p>Webinars, fairs and info sessions for the schools on your list. Add them by hand, or import what the scraper collected.</p>'+
   '<div class="actions"><button class="btn sm" type="button" id="s-past">'+(ui.semPast?"Hide past":"Show past")+'</button>'+
   '<button class="btn sm" type="button" id="s-src">'+ICON.down+'Download scraper sources</button>'+
   '<button class="btn sm" type="button" id="s-imp"'+(readOnly?" disabled":"")+'>'+ICON.up+'Import scraped seminars</button>'+
   '<button class="btn sm primary" type="button" id="s-add"'+(readOnly?" disabled":"")+'>'+ICON.plus+'Add seminar</button></div></div>';
  if(!list.length){html+='<div class="list"><div class="empty"><h3>No upcoming seminars</h3><p>Run the scraper and import its file, or add a seminar you found yourself.</p></div></div>'}
  else{
   html+='<div class="list">'+list.map(function(x){var i=seminars.indexOf(x),d=new Date(x.date+"T00:00:00"),dl=daysLeft(x.date),past=dl!=null&&dl<0;
    var when=[x.time,x.timezone].filter(Boolean).join(" ");
    var tags=(x.related_entry_ids||[]).map(entryName).filter(Boolean);
    return'<div class="sem'+(past?" past":"")+'"><div class="cal" aria-hidden="true"><div class="m">'+mon[d.getMonth()]+'</div><div class="d">'+d.getDate()+'</div><div class="w">'+wk[d.getDay()]+'</div></div>'+
     '<div><h4>'+esc(x.title)+'</h4><div class="o">'+esc([x.organizer,fmtDate(x.date),when||null,x.mode].filter(Boolean).join(", "))+(dl!=null&&dl>=0?(dl===0?". Today.":". In "+dl+(dl===1?" day.":" days.")):"")+'</div>'+
     (x.notes?'<div class="n">'+esc(x.notes)+'</div>':'')+
     (tags.length?'<div class="tags">'+tags.slice(0,3).map(function(t){return'<span class="tag">'+esc(t)+'</span>'}).join("")+(tags.length>3?'<span class="tag">+'+(tags.length-3)+' more</span>':'')+'</div>':'')+'</div>'+
     '<div class="acts">'+(x.url?'<a class="btn sm" href="'+esc(x.url)+'" target="_blank" rel="noopener">Open page</a>':'')+
     '<button class="btn sm'+(x.registered?" on":"")+'" type="button" data-reg="'+i+'" aria-pressed="'+!!x.registered+'"'+(readOnly?" disabled":"")+'>'+(x.registered?"Registered":"Mark registered")+'</button>'+
     '<button class="icon-btn" type="button" data-sdel="'+i+'" aria-label="Remove seminar"'+(readOnly?" disabled":"")+'>'+ICON.trash+'</button></div></div>'}).join("")+'</div>';
  }
  html+='<div class="how"><h3>How the seminar scraper works</h3>This page can\'t visit other websites by itself, because browsers block that for security. The scraper is a small Python script you run on your own computer.<ol>'+
   '<li>Click <b>Download scraper sources</b>. It lists the event pages and scholarship links in this tracker.</li>'+
   '<li>Run <code>python seminar_scraper.py --sources scraper_sources.json --out seminars.json</code>.</li>'+
   '<li>Click <b>Import scraped seminars</b> and pick <code>seminars.json</code>. Duplicates are skipped.</li></ol></div>';
  c.innerHTML=html;
  $("s-past").onclick=function(){ui.semPast=!ui.semPast;renderContent()};
  $("s-src").onclick=exportSources;
  $("s-imp").onclick=function(){$("file-in").click()};
  $("s-add").onclick=openSemForm;
  c.querySelectorAll("[data-reg]").forEach(function(b){b.onclick=function(){var x=seminars[+b.dataset.reg];x.registered=!x.registered;renderContent();persist(x.registered?"Marked as registered":"Unmarked")}});
  c.querySelectorAll("[data-sdel]").forEach(function(b){b.onclick=function(){var x=seminars[+b.dataset.sdel];seminars.splice(+b.dataset.sdel,1);render();persist("Removed "+x.title)}});
}
function openSemForm(){
  if(readOnly)return;
  var opts=state.map(function(it){var e=E(it);return'<button type="button" class="chip" data-opt="'+esc(e.tracker_meta.entry_id)+'" aria-pressed="false"><span class="box"></span>'+esc(e.scholarship_core.scholarship_name||e.tracker_meta.entry_id)+'</button>'}).join("");
  $("modal").innerHTML='<div class="dialog" style="width:min(640px,100%)"><header><h2 id="m-title">Add seminar</h2><button class="icon-btn" type="button" id="m-x" aria-label="Close">'+ICON.x+'</button></header><form class="body" novalidate><fieldset><div class="grid">'+
   '<div class="field wide"><label for="sf-title">Title *</label><input id="sf-title"></div>'+
   '<div class="field"><label for="sf-org">Organizer</label><input id="sf-org"></div>'+
   '<div class="field"><label for="sf-date">Date *</label><input id="sf-date" type="date"></div>'+
   '<div class="field"><label for="sf-time">Time</label><input id="sf-time" placeholder="e.g. 15:00–16:00"></div>'+
   '<div class="field"><label for="sf-tz">Time zone</label><input id="sf-tz" placeholder="e.g. CET"></div>'+
   '<div class="field"><label for="sf-mode">Format</label><select id="sf-mode"><option>Online</option><option>In person</option><option>Hybrid</option></select></div>'+
   '<div class="field"><label for="sf-url">Event page</label><input id="sf-url" type="url" placeholder="https://"></div>'+
   '<div class="field wide"><label for="sf-notes">Notes</label><textarea id="sf-notes"></textarea></div>'+
   '<div class="field wide"><label>Related scholarships</label><div class="docs" id="sf-rel">'+opts+'</div></div>'+
   '</div></fieldset><p class="err" id="m-err" role="alert"></p></form><footer><button class="btn" type="button" id="m-cancel">Cancel</button><button class="btn primary" type="button" id="m-save">Add seminar</button></footer></div>';
  $("modal").classList.add("open");$("scrim").classList.add("open");$("sf-title").focus();
  $("sf-rel").querySelectorAll(".chip").forEach(function(b){b.onclick=function(){var on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",String(on));b.querySelector(".box").textContent=on?"✓":""}});
  $("m-x").onclick=closeAll;$("m-cancel").onclick=closeAll;
  $("m-save").onclick=function(){
    var t=$("sf-title").value.trim(),d=$("sf-date").value,u=$("sf-url").value.trim(),err=[];
    if(!t)err.push("Title is required");if(!d)err.push("Date is required");if(u&&!/^https:\/\/\S+$/.test(u))err.push("Event page must start with https://");
    if(err.length){$("m-err").textContent=err.join(". ")+".";return}
    var rel=[].slice.call($("sf-rel").querySelectorAll('.chip[aria-pressed="true"]')).map(function(b){return b.dataset.opt});
    var n=mergeSeminars([{title:t,organizer:$("sf-org").value.trim(),date:d,time:$("sf-time").value.trim(),timezone:$("sf-tz").value.trim(),mode:$("sf-mode").value,url:u||null,notes:$("sf-notes").value.trim(),related_entry_ids:rel,source:"Added by hand"}]);
    closeAll();render();persist(n?"Seminar added":"That seminar is already on the list");
  };
}
function localDownload(name,text){try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);return true}catch(e){return false}}
function saveFile(name,text,okMsg){
  if(!window.claude&&localDownload(name,text)){toast(okMsg);return}
  if(downloads){downloads.save({filename:name,data:new Blob([text],{type:"application/json"})}).then(function(r){if(r&&r.status==="saved")toast(okMsg)},function(err){if(err&&err.code==="unavailable"){downloads=null}else if(err&&err.code!=="declined"&&err.code!=="cancelled")toast("Download didn't finish. Try again.")});return}
  try{navigator.clipboard.writeText(text).then(function(){toast("Copied to clipboard. Paste it into "+name)},function(){toast("Downloads aren't available in this view")})}catch(e){toast("Downloads aren't available in this view")}
}
function exportSources(){
  var seen={},out=[];
  function add(u,org,id){if(!u||!/^https:\/\//.test(u))return;var k=u.replace(/\/$/,"");if(seen[k]){if(id&&seen[k].related_entry_ids.indexOf(id)<0)seen[k].related_entry_ids.push(id);return}seen[k]={url:u,organizer:org||"",related_entry_ids:id?[id]:[]};out.push(seen[k])}
  sources.forEach(function(s){add(s.url,s.organizer);(s.related_entry_ids||[]).forEach(function(id){add(s.url,s.organizer,id)})});
  state.forEach(function(it){var e=E(it),id=e.tracker_meta.entry_id,org=e.university_profile.university_name;add(e.scholarship_core.scholarship_page_url,org,id);add(e.university_profile.official_website,org,id)});
  saveFile("scraper_sources.json",JSON.stringify({sources:out},null,2),"Downloaded scraper_sources.json");
}

/* ---------- Import / export ---------- */
function exportJSON(){
  var out=JSON.stringify(state.map(function(it){return{scholarship_entry:E(it)}}),null,2);
  var name="scholarship_tracker_"+todayISO()+".json";
  if(!window.claude&&localDownload(name,out)){toast("Exported "+name);return}
  if(downloads){downloads.save({filename:name,data:new Blob([out],{type:"application/json"})}).then(function(r){if(r&&r.status==="saved")toast("Exported "+name)},function(err){if(err&&err.code==="unavailable"){downloads=null}else if(err&&err.code!=="declined"&&err.code!=="cancelled")toast("Export didn't finish. Try again.")});return}
  try{navigator.clipboard.writeText(out).then(function(){toast("Export copied to clipboard")},function(){toast("Export isn't available in this view")})}catch(e){toast("Export isn't available in this view")}
}
function importJSON(ev){
  var file=ev.target.files&&ev.target.files[0];ev.target.value="";if(!file)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var data=JSON.parse(r.result);
      if(data&&!Array.isArray(data)&&Array.isArray(data.seminars)&&!Array.isArray(data.entries)){var n=mergeSeminars(data.seminars);render();persist(n?("Imported "+n+(n===1?" seminar":" seminars")):"No new seminars in that file");return}
      if(data&&!Array.isArray(data)&&Array.isArray(data.entries)){if(Array.isArray(data.seminars))mergeSeminars(data.seminars);data=data.entries}
      var arr=Array.isArray(data)?data:[data];
      var added=0;
      arr.forEach(function(x){var ent=x&&x.scholarship_entry?x.scholarship_entry:(x&&x.tracker_meta?x:null);if(!ent)return;
        var base=E(blankEntry());var merged=deepMerge(base,ent);
        if(state.some(function(i){return E(i).tracker_meta.entry_id===merged.tracker_meta.entry_id}))merged.tracker_meta.entry_id=E(blankEntry()).tracker_meta.entry_id;
        state.push({scholarship_entry:merged,_progress:{docs_ready:[]}});added++});
      if(!added){toast("No scholarship entries found in that file");return}
      render();persist("Imported "+added+(added===1?" scholarship":" scholarships"));
    }catch(e){toast("That file isn't valid JSON")}
  };
  r.readAsText(file);
}
function deepMerge(a,b){Object.keys(b||{}).forEach(function(k){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k]))deepMerge(a[k],b[k]);else a[k]=b[k]});return a}

/* ---------- Boot ---------- */
render();
if(ui.open!=null&&state[ui.open])openDrawer(ui.open);
if(window.claude&&typeof window.claude.use==="function"){
  window.claude.use("artifact").then(function(a){capChecked=true;artifact=a;
    if(!a){try{var ls=localStorage.getItem(LOCAL_KEY);if(ls){loadData(JSON.parse(ls));render()}}catch(e){}}
  },function(){capChecked=true});
  window.claude.use("downloads").then(function(d){downloads=d},function(){});
}else{
  capChecked=true;
  try{var ls=localStorage.getItem(LOCAL_KEY);if(ls){loadData(JSON.parse(ls));render()}}catch(e){}
}
})();
</script>
